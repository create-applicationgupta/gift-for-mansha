<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miss you jaanu</title>
    <meta
      name="description"
      content="Miss you jaanu — a soft personal space made with love. Open Our Personal Space for photos and love notes."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://gift-for-mansha.vercel.app/miss-you-jaanu.html" />
    <meta property="og:title" content="Miss you jaanu" />
    <meta
      property="og:description"
      content="Miss you jaanu. A private gift website for the two of us."
    />
    <meta property="og:url" content="https://gift-for-mansha.vercel.app/miss-you-jaanu.html" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Source+Sans+3:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #2c2422;
        --soft: #5c504c;
        --accent: #b76e79;
        --pearl: #f7f2f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 80% 60% at 15% 20%, rgba(232, 180, 184, 0.35), transparent 55%),
          linear-gradient(165deg, #faf6f4 0%, #f3e9e6 45%, #efe4e0 100%);
      }
      main {
        width: min(32rem, 100%);
        text-align: center;
      }
      .eyebrow {
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.8rem;
        color: #8a7c78;
        margin-bottom: 1rem;
      }
      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(2.8rem, 8vw, 3.8rem);
        margin: 0 0 0.85rem;
      }
      p {
        color: var(--soft);
        font-weight: 300;
        line-height: 1.65;
        margin: 0 0 1.75rem;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.85rem 1.75rem;
        border-radius: 999px;
        background: var(--accent);
        color: #fffcfb;
        text-decoration: none;
        font-weight: 500;
      }
      a.btn:hover {
        background: #c47880;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A private corner</p>
      <h1>Miss you jaanu</h1>
      <p>
        This is Our Personal Space — a quiet place for photos, love notes, and
        memories. Enter when you are ready.
      </p>
      <a class="btn" href="/">Open Our Personal Space</a>
    </main>
  </body>
</html>
